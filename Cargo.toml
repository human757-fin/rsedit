[package]
name = "rsedit"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "rsedit - a minimal, fast, cross-platform video editor"
license = "MIT"

[dependencies]
eframe = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ffmpeg-next = "8"
cpal = "0.15"
image = "0.25"
ab_glyph = "0.2"
fontdb = "0.16"
anyhow = "1"
once_cell = "1"
rfd = "0.15"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true