[package]
name = "rsedit-installer"
version = "0.2.0"
edition = "2021"
description = "rsedit GUI installer"
license = "MIT"

[dependencies]
eframe = "0.31"
ureq = { version = "3", features = ["json"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
flate2 = "1"
tar = "0.4"
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
zip = "2"
winreg = "0.52"

[profile.release]
lto = "thin"
strip = true
opt-level = "s"