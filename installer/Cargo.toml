[package]
name = "fast-cutter-installer"
version = "0.1.1"
edition = "2021"
description = "Fast Cutter GitHub-powered installer"
license = "MIT"

[dependencies]
ureq = { version = "3", features = ["json"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
zip = "2"
winreg = "0.52"

[profile.release]
lto = "thin"
strip = true
opt-level = "s"