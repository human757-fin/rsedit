name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to build (without 'v', e.g. 0.2.0). Leave blank to use latest Cargo.toml version."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build (Windows / portable + installer)
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Install FFmpeg via vcpkg (shared / MSVC)
        shell: pwsh
        run: |
          vcpkg install ffmpeg:x64-windows
          echo "VCPKG_ROOT=$env:VCPKG_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $ver = "${{ inputs.version }}"
          if (-not $ver) { $ver = (Select-String '^version\s*=\s*"([^"]+)"' Cargo.toml).Matches[0].Groups[1].Value }
          "value=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build app (release)
        run: cargo build --release

      - name: Stage portable build
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.value }}"
          $root = "FastCutter-$ver"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item target\release\fast-cutter.exe "$root\FastCutter.exe"
          # Bundle runtime DLLs so the portable zip is self-contained.
          $vcpkgLibs = "$env:VCPKG_ROOT\installed\x64-windows\bin"
          if (Test-Path $vcpkgLibs) {
            Copy-Item "$vcpkgLibs\avcodec*.dll" "$root\" -ErrorAction SilentlyContinue
            Copy-Item "$vcpkgLibs\avformat*.dll" "$root\" -ErrorAction SilentlyContinue
            Copy-Item "$vcpkgLibs\avutil*.dll" "$root\" -ErrorAction SilentlyContinue
            Copy-Item "$vcpkgLibs\swscale*.dll" "$root\" -ErrorAction SilentlyContinue
            Copy-Item "$vcpkgLibs\swresample*.dll" "$root\" -ErrorAction SilentlyContinue
            Copy-Item "$vcpkgLibs\avfilter*.dll" "$root\" -ErrorAction SilentlyContinue
            Copy-Item "$vcpkgLibs\postproc*.dll" "$root\" -ErrorAction SilentlyContinue
          }
          Copy-Item README.md "$root\README.md"
          Copy-Item LICENSE "$root\LICENSE.txt"
          Set-Content "$root\version.txt" $ver
          Compress-Archive -Path "$root\*" -DestinationPath "FastCutter-$ver-windows-portable.zip"
          Get-ChildItem "FastCutter-$ver-windows-portable.zip" | Select-Object Name, Length

      - name: Build installer (release)
        run: cargo build --release --manifest-path installer/Cargo.toml

      - name: Stage installer
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.value }}"
          Copy-Item installer\target\release\fast-cutter-installer.exe "FastCutter-Setup-$ver.exe"
          Get-ChildItem "FastCutter-Setup-$ver.exe" | Select-Object Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: |
            FastCutter-${{ steps.version.outputs.value }}-windows-portable.zip
            FastCutter-Setup-${{ steps.version.outputs.value }}.exe
          if-no-files-found: error

  build-linux:
    name: Build (Linux / portable + AppImage)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev \
            libavcodec-dev libavformat-dev libavutil-dev \
            libswscale-dev libavfilter-dev libswresample-dev \
            libasound2-dev clang

      - uses: Swatinem/rust-cache@v2

      - name: Resolve version
        id: version
        shell: bash
        run: |
          ver="${{ inputs.version }}"
          if [ -z "$ver" ]; then
            ver=$(sed -n 's/^version\s*=\s*"\([^"]*\)"/\1/p' Cargo.toml | head -1)
          fi
          echo "value=$ver" >> "$GITHUB_OUTPUT"

      - name: Build app (release)
        run: cargo build --release

      - name: Stage portable build
        shell: bash
        run: |
          ver="${{ steps.version.outputs.value }}"
          root="FastCutter-$ver-linux-x86_64"
          mkdir -p "$root"
          cp target/release/fast-cutter "$root/FastCutter"
          cp README.md "$root/README.md"
          cp LICENSE "$root/LICENSE.txt"
          printf '%s\n' "$ver" > "$root/version.txt"
          tar -czf "FastCutter-$ver-linux-x86_64.tar.gz" "$root"
          ls -la "FastCutter-$ver-linux-x86_64.tar.gz"

      - name: Build installer (release)
        run: cargo build --release --manifest-path installer/Cargo.toml

      - name: Stage Linux installer
        shell: bash
        run: |
          ver="${{ steps.version.outputs.value }}"
          cp installer/target/release/fast-cutter-installer "FastCutter-Setup-$ver-linux-x86_64"
          chmod +x "FastCutter-Setup-$ver-linux-x86_64"
          ls -la "FastCutter-Setup-$ver-linux-x86_64"

      - name: Build AppImage
        shell: bash
        run: |
          ver="${{ steps.version.outputs.value }}"
          appdir="FastCutter.AppDir"
          mkdir -p "$appdir/usr/bin"
          cp target/release/fast-cutter "$appdir/usr/bin/fast-cutter"
          cp packaging/fast-cutter.desktop "$appdir/fast-cutter.desktop"
          cp packaging/fast-cutter.png "$appdir/fast-cutter.png"
          cp packaging/AppRun "$appdir/AppRun"
          chmod +x "$appdir/AppRun" "$appdir/usr/bin/fast-cutter"

          curl -sL -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          /tmp/appimagetool --appimage-extract-and-run "$appdir" "FastCutter-$ver-x86_64.AppImage"
          ls -la "FastCutter-$ver-x86_64.AppImage"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: |
            FastCutter-${{ steps.version.outputs.value }}-linux-x86_64.tar.gz
            FastCutter-${{ steps.version.outputs.value }}-x86_64.AppImage
            FastCutter-Setup-${{ steps.version.outputs.value }}-linux-x86_64
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-dist
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: linux-dist
          path: dist

      - name: Generate checksums
        shell: bash
        run: |
          (cd dist && sha256sum FastCutter-* > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Determine tag name
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=v${{ needs.build-windows.outputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Fast Cutter ${{ steps.tag.outputs.name }}
          body: |
            ## Fast Cutter

            Full MVP: timeline, video/image/audio import, text overlays, audio mixing with fades/gain, and MP4 export.

            ### Downloads

            | File | Description |
            |---|---|
            | `FastCutter-Setup-*.exe` | Windows GUI installer — downloads the latest portable build from GitHub, installs per-user (no admin), with togglable Start Menu + desktop shortcuts. |
            | `FastCutter-*-windows-portable.zip` | Windows portable build (includes runtime FFmpeg DLLs). |
            | `FastCutter-Setup-*-linux-x86_64` | Linux GUI installer — same flow: app-menu + desktop shortcut toggles. |
            | `FastCutter-*-linux-x86_64.tar.gz` | Linux portable build. Requires `libavcodec` etc. on the system. |
            | `FastCutter-*-x86_64.AppImage` | Linux AppImage. Self-contained, runs on most distros. |

            Verification: `SHA256SUMS.txt` contains checksums for every archive.

            ### Install (GUI installer, Windows and Linux)

            ```sh
            # Windows
            .\FastCutter-Setup-*.exe
            # Linux
            chmod +x FastCutter-Setup-*-linux-x86_64 && ./FastCutter-Setup-*-linux-x86_64
            ```

            The installer fetches the latest portable build straight from this
            repository's Release page and installs for the current user only —
            Windows: `%LOCALAPPDATA%\Programs\FastCutter`, Linux:
            `~/.local/share/FastCutter`. From the GUI you can toggle a
            Start Menu (Windows) / applications-menu (Linux) shortcut and a
            desktop shortcut. Windows also registers a per-user Uninstall entry,
            and a headless `--uninstall` flag is supported by both.

            ### Linux (portable)

            ```sh
            # Ubuntu/Debian: install runtime libs
            sudo apt install libavcodec61 libavformat61 libswscale8 libavfilter10 libswresample5
            tar -xzf FastCutter-*-linux-x86_64.tar.gz
            ./FastCutter-*/FastCutter
            ```

            ### Linux (AppImage)

            ```sh
            chmod +x FastCutter-*-x86_64.AppImage
            ./FastCutter-*-x86_64.AppImage
            ```
          files: |
            dist/*
